<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        background-color: #f4f4f4;
        font-weight: 18px;
    }
    .card-container {
        display: flex;
        gap: 20px;
        padding: 20px;
        flex-wrap: wrap;
        justify-content: center;
    }
    .movie-card {
        background-color: #fff;
        border-radius: 16px;
        border-color: #fff;
        border: .5 px solid black;
        width: 200px;
        overflow: hidden;
        
    }
    .movie-image img {
        width: 100%;
        height: auto;
        border-top-left-radius: 16px;
        border-top-right-radius: 16px;
        border: 1px solid black;

    }
    .movie-details{
        padding: 10px;
        
    }
    .movie-title {
        font-size: 18px;
        margin: 0;
    }
    .movie-rating {
        font-size: 14px;
        margin: 5px 0 15px 0;
    }
</style>
<body>
    <div class = "card-container">
        <div class = "movie-card">
            <div class = "movie-image">
                <img src = "https://cdn.district.in/movies-assets/images/cinema/Hanuman-Ansh-3199a900-6975-11f1-a51b-91d242246b61.jpg" alt = "Movie Poster">
            </div>
            <div class = "movie-details">

            </div>
        </div>


        <div class = "movie-card">

            </div>
            <div class = "movie-details">

                <p class="movie-rating">A+|Hindi and 1 more</p>
            </div>
        </div>


        <div class = "movie-card">
            <div class = "movie-image">
                <img src = "https://cdn.district.in/movies-assets/images/cinema/_Poster-d0d78f60-961a-11f1-8483-eb84b060bac3.jpg" alt = "Movie Poster">

            </div>
            <div class = "movie-details">
                <h5 class = "movie-title">Awarapan 2 </h5>

            </div>
        </div>
